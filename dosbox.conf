# dosbox.conf -- Laboratorio Post1 Unidad 6
# Se coloca en la raiz del proyecto y se inicia con: dosbox-x.exe -conf dosbox.conf

[dos]
# DOS 7.1 con nombres largos: lab6_instrucciones.asm excede el formato 8.3
ver=7.1
lfn=true

[cpu]
core=normal
cputype=auto
# la velocidad no afecta a estos programas (no miden tiempo)
cycles=max

[autoexec]
# Montar el directorio del proyecto como unidad C:
mount c "C:\Users\Cesar\salas-post1-u6"
c:
# nasm.exe y cwsdpmi.exe viven en la raiz del proyecto
path %PATH%;C:\
# nasm.exe (DJGPP) necesita un host DPMI residente
cwsdpmi -p > nul
echo DOSBox listo. Directorio de trabajo: C:\
cls
